name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# One group per ref, so a branch can only ever cancel its own runs -- never another
# branch's, and never another repository's: concurrency groups are scoped to this
# repository. A second push to the same branch supersedes the first and frees the
# runner slot instead of leaving a stale run to finish.
#
# `main` is the exception: a run on main is release evidence, so it is never
# cancelled by a later push and always runs to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: normal
            args: ""
          - name: strict
            args: "--strict"
          - name: asan-ubsan
            args: "--strict --sanitizer asan-ubsan"
          - name: tsan
            args: "--strict --sanitizer tsan"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            git \
            liblgpio-dev \
            libusb-1.0-0-dev

      - name: Build pinned RadioLib
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/ci/radiolib.lock"
          git clone --filter=blob:none "$RADIOLIB_URL" "$RUNNER_TEMP/RadioLib"
          git -C "$RUNNER_TEMP/RadioLib" checkout --detach "$RADIOLIB_COMMIT"
          cmake -S "$RUNNER_TEMP/RadioLib" -B "$RUNNER_TEMP/RadioLib/build" \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build "$RUNNER_TEMP/RadioLib/build" --parallel 2
          test -f "$RUNNER_TEMP/RadioLib/build/libRadioLib.a"

      # The Meshstick library from the real pinned pine64 source, once: the
      # normal lane builds the daemon with PINEDIO_DIR set, so build.sh attests
      # the checkout and compiles lib/libloraham-ch341.so; the other lanes
      # build without it, as a source build without the library does.
      - name: Check out pinned pine64 libch341-spi-userspace (normal lane)
        if: matrix.name == 'normal'
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/ci/libpinedio.lock"
          git clone --filter=blob:none "$PINEDIO_URL" "$RUNNER_TEMP/libch341-spi-userspace"
          git -C "$RUNNER_TEMP/libch341-spi-userspace" checkout --detach "$PINEDIO_COMMIT"
          echo "PINEDIO_DIR=$RUNNER_TEMP/libch341-spi-userspace" >> "$GITHUB_ENV"

      # Its own step: the test counts every loraham_daemon on the runner, so it must not
      # overlap the suite's daemons.
      - name: Test runner liveness predicate (normal lane)
        if: matrix.name == 'normal'
        run: loraham_daemon/tests/test_daemon_liveness.sh

      # What a run leaves in /tmp is checked against this list: the suite keeps its
      # files in its own TMPDIR and removes that at exit.
      - name: List /tmp before the tests
        id: tmp_before
        shell: bash
        run: |
          set -euo pipefail
          ls -A /tmp | sort > "$RUNNER_TEMP/tmp-before.txt"

      # Red-before harness only (never on the topic): no suite; the check's after-listing
      # below is pointed at a directory that does not exist, so that listing fails.
      - name: Run tests
        working-directory: loraham_daemon
        run: |
          echo "harness - the suite is not run; the after-listing will fail"

      # Also after a failed test step (a failing run must not hide a leftover); not after a
      # cancel, and only where the list above was taken.
      - name: No test files left in /tmp
        if: ${{ !cancelled() && steps.tmp_before.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          # Both listings are files from checked pipelines: a failed listing fails the step.
          ls -A "/tmp/no-such-dir-${GITHUB_RUN_ID}" | sort > "$RUNNER_TEMP/tmp-after.txt"
          left="$(comm -13 "$RUNNER_TEMP/tmp-before.txt" "$RUNNER_TEMP/tmp-after.txt")"
          if [[ -n "$left" ]]; then
            echo "FAIL: the test run left these new entries in /tmp:"
            printf '%s\n' "$left"
            exit 1
          fi
          echo "OK: no new entry in /tmp"

      - name: Meshstick library built from the pinned source (normal lane)
        if: matrix.name == 'normal'
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/ci/libpinedio.lock"
          so=loraham_daemon/lib/libloraham-ch341.so
          test -f "$so"
          nm -D --defined-only "$so" | grep -qw loraham_ch341_pin
          grep -qaF "$PINEDIO_COMMIT" "$so"
          echo "OK: $so carries pine64 $PINEDIO_COMMIT"

      - name: Chat client tests (normal lane)
        if: matrix.name == 'normal'
        run: |
          sudo apt-get install --yes --no-install-recommends libncurses-dev
          clients/chat/run_tests.sh

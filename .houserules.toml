# The house-rules profile of this C and C++ repository, for LoRaHAM Pi Control's tools/check_houserules.py
# (`check_houserules.py <base>..<head>`, run in this repository). The checker reads it at <base>, so a range
# cannot relax its own rules. Attribution, markers and the HARD patterns are the checker's own and apply as
# in every repository.

# The tests: the daemon's tests and the chat client's tests are two layers. A test is a `test_...()` function
# or an `expect(` line.
layers = [["loraham_daemon/tests/", "daemon"], ["clients/chat/tests/", "chat"]]
test_files = ["test_*.cpp", "test_*.c", "test_*.sh"]
test_def = '^\s*(((static\s+)?(void|int|bool)\s+test_[A-Za-z0-9_]+\()|expect\()'

# No module budgets: the checker measures modules as Python (ast), which a C or C++ source is not.
budget_file = ""
family_dir = ""

changelog = "loraham_daemon/CHANGELOG.md"

# In added test lines: a sleep that would decide an outcome (H3), and a network call (the tests use local
# UNIX sockets only).
[warn_patterns]
sleep = '\b(u|nano)?sleep\s*\('
network = '\b(getaddrinfo|gethostbyname|AF_INET6?)\b'
